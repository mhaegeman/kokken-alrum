<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Køkken alrum · renovation tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔨%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <div class="logo">KA</div>
        <div>
          <h1>Køkken alrum</h1>
          <p class="subtitle">Copenhagen renovation tracker</p>
        </div>
      </div>
      <div class="actions">
        <button id="export-btn" class="btn-ghost">Export</button>
        <button id="import-btn" class="btn-ghost">Import</button>
        <input type="file" id="import-file" accept="application/json" hidden>
        <button id="reset-btn" class="btn-ghost danger">Reset</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <div class="container">
      <button class="tab active" data-view="tasks">Tasks</button>
      <button class="tab" data-view="timeline">Timeline</button>
      <button class="tab" data-view="budget">Budget</button>
    </div>
  </nav>

  <main class="container">
    <section class="stats" id="stats"></section>
    <section id="view-root"></section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Local-only · data stored in your browser · <a href="https://github.com/mhaegeman/kokken-alrum" target="_blank" rel="noopener">view source on GitHub</a></p>
    </div>
  </footer>

  <script src="data/initial.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
